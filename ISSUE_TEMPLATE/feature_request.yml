name: 功能请求
description: 建议一个新功能或改进
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请填写以下信息帮助我们理解你的需求。

  - type: dropdown
    id: mod
    attributes:
      label: 相关模组
      options:
        - RimMind-Core
        - RimMind-Actions
        - RimMind-Advisor
        - RimMind-Personality
        - RimMind-Dialogue
        - RimMind-Memory
        - RimMind-Storyteller
        - Bridge-RimTalk
        - Bridge-RimChat
        - 新模组建议
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 问题/动机
      description: 这个功能解决什么问题？为什么需要它？
      placeholder: |
        例如：
        - 目前 Advisor 的选择有时不符合角色设定
        - 缺少某种类型的动作支持
        - 希望有更灵活的叙事控制
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 描述你希望如何实现这个功能
      placeholder: |
        例如：
        - 添加一个新的配置选项...
        - 在 Advisor 的决策逻辑中加入...
        - 为 Storyteller 增加新的事件类型...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你是否考虑过其他实现方式？

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 任何其他相关信息、截图或参考

  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单
      options:
        - label: 我已搜索现有 Issue，确认没有重复的功能请求
          required: true
        - label: 我已考虑过该功能的实现复杂度和对现有系统的影响
          required: false
        - label: 我愿意参与该功能的实现（如有需要）
          required: false
